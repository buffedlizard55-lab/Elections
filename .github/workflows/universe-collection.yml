# Forward collection loop (ROADMAP R1/R3) — ENABLED BY DEFAULT.
# GitHub-hosted runners have normal network access to the official Kalshi
# public API, so this is where the "networked runner" collection happens:
#   1. full open-market universe (every politics/elections series) + series registry
#   2. append-only daily price tracker (the R3 forward-calibration feed)
#   3. settled-2026 candle seed (calibration on already-settled 2026 markets)
#   4. one-time 2024 per-state Senate capture (R2; idempotent, never rewrites)
# then deterministic analytics, site rebuild, provenance lint, tests, commit.
#
# NOTE on the gate: the older daily-collection.yml is gated behind the
# vars.COLLECT_ENABLED repository variable; the automation token in this
# project cannot write repository variables (API returns 403), so instead of
# leaving collection disabled this workflow runs unconditionally on schedule.
# A failed run commits nothing (collectors exit non-zero on empty captures).
name: universe-collection
on:
  schedule:
    - cron: '40 12 * * *' # daily 12:40 UTC (20 min after the Python snapshot workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests on the committed state (validate before collecting)
        run: npm test
      - name: Collect open universe + tracker + settled-2026 seed
        run: node scripts/collect-universe.mjs
      - name: Capture 2024 per-state Senate markets (idempotent)
        run: node scripts/collect-senate-2024-races.mjs
      - name: Deterministic analytics (2024 Senate backtest + 2026 calibration tracker)
        run: |
          node scripts/run-senate-backtest.mjs || echo "senate backtest skipped (capture pending)"
          node scripts/run-calibration.mjs || echo "calibration skipped (seed pending)"
      - name: Rebuild site bundle
        run: node scripts/build-site.mjs
      - name: Lint provenance (fatal — every new data file must carry its capture URL)
        run: node scripts/lint-verified.mjs
      - name: Commit changes
        run: |
          git config user.name "elections-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/ src/data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "collect: universe + tracker $(date -u +%F) (run ${{ github.run_id }}) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || echo "rebase skipped (push may need retry)"
            git push
          fi

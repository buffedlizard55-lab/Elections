# Daily Kalshi collection — the forward data loop (ROADMAP R1 / R3 / R5).
#
# ENABLED BY DEFAULT since 2026-09-19 (opt-out: set repository variable
# COLLECT_DISABLED=true). Before that date the job was gated behind an opt-in
# variable because the collector had never been exercised against the live
# API; the 2026-09-19 session proved it on a GitHub-hosted runner (this
# workflow's push trigger) and committed the first universe/tracker files.
#
# One run:
#   1. node scripts/collect-kalshi.mjs      -> series registry, open political/election universe,
#                                              daily tracker CSV, settlements, calibration,
#                                              consistency findings, site bundle
#   2. node scripts/collect-senate-2024.mjs -> only when the 2024 Senate capture is missing
#                                              (or forced via workflow_dispatch input)
#   3. python scripts/fetch_kalshi.py       -> Python-track independent sample (top 2,000 by volume)
#      node scripts/crosscheck-collectors.mjs -> tracker/collector-crosscheck.json (agreement report)
#   3b. node scripts/collect-universe.mjs   -> FULL open-market snapshot (all ~24k open political/
#                                              election markets, not just top-volume) + settled-2026
#                                              candle seed -> data/kalshi/forward/ (continue-on-error:
#                                              a failure here never blocks the main pipeline above)
#       node scripts/collect-senate-2024-races.mjs -> per-state 2024 Senate capture (36-39 markets
#                                              incl. candles) -> data/kalshi/historical-2024/
#       node scripts/run-senate-backtest.mjs + run-calibration.mjs -> forward-loop analytics
#                                              (data/senate-2024-backtest.json, data/calibration-2026.json)
#   3c. node scripts/collect-metaculus.mjs      -> Metaculus hub + per-seat question pages -> data/crosslayer/ (R14)
#       node scripts/collect-statenavigate.mjs  -> State Navigate free forecast pages (headless-Chrome rendered) + API-host probe -> data/statenavigate/
#       node scripts/crosscheck-renderings.mjs  -> EBO / DDHQ / 270toWin vs captured prices -> tracker/rendering-crosscheck.json (R13)
#       node scripts/probe-hosts.mjs            -> re-test of every previously unreachable host -> data/probes/ (R15)
#       (collector-probe.yml runs just these four steps on demand — the fast lane for parser fixes and re-tests)
#   4. npm run pipeline + lint + tests      -> regenerated backtest/contest/site outputs
#   5. commit data/ + src/data/ + docs/data/ back to the branch that ran it
# Failure semantics:
#   - the collector fetches everything first and writes only at the end, so a
#     fatal API error leaves just tracker/daily/<date>.error.json (committed as
#     the audit record) and yesterday's universe stays in place;
#   - the commit step runs whenever the job was not cancelled, but if the
#     pipeline / lint / tests did not succeed it restores the generated site
#     bundles (src/data, docs/data) from HEAD before committing, so raw data is
#     never lost and a broken bundle is never published to GitHub Pages;
#   - the former universe-collection.yml (a second daily cron for the forward loop) was retired
#     when the branches merged on 2026-09-19: its steps now run inside this workflow (3b), so
#     there is exactly ONE daily collection pass;
#   - if a human push lands mid-run, the bot rebases and keeps its own version
#     of any conflicting generated file (run 35413487160 on 2026-09-19 lost its
#     commit to exactly this race before the -X theirs / --abort retry existed;
#     its artifacts stayed available for 7 days).
name: daily-collection
on:
  schedule:
    - cron: '30 12 * * *' # 12:30 UTC daily (US markets mid-session)
  workflow_dispatch:
    inputs:
      senate2024:
        description: 'Force re-capture of the 2024 per-state Senate markets'
        required: false
        default: 'false'
  # Lightweight collectors/scorers are exercised by collector-probe instead.
  # Schedule and manual dispatch still execute the entire universe collection.
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/collect-kalshi.mjs'
      - 'scripts/collect-senate-2024.mjs'
      - 'scripts/crosscheck-collectors.mjs'
      - 'scripts/fetch_kalshi.py'
      - 'src/kalshi-api.js'
      - 'src/calibration.js'
      - 'src/consistency.js'
      - 'scripts/collect-universe.mjs'
      - 'scripts/collect-senate-2024-races.mjs'
      - 'scripts/run-senate-backtest.mjs'
      - 'scripts/run-calibration.mjs'
      - 'src/kalshi-live.js'
      - 'src/calibration-tracker.js'
      - 'src/senate2024-backtest.js'
      - 'test/collector.test.mjs' # the offline replay test must be proven against a live capture

permissions:
  contents: write

# One concurrency group is SHARED by daily-collection.yml and collector-probe.yml: both commit the same files
# (data/crosslayer, data/statenavigate, rendering-crosscheck) and the commit step resolves conflicts with
# `rebase -X theirs`, so two overlapping runs silently drop each other's rows (irregularity #63, 2026-09-20).
concurrency:
  group: collectors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ vars.COLLECT_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect open political/election universe + tracker
        id: collect
        run: node scripts/collect-kalshi.mjs

      - name: Capture 2024 per-state Senate markets (first run or forced)
        if: ${{ hashFiles('data/kalshi/historical/senate-2024.json') == '' || inputs.senate2024 == 'true' }}
        run: node scripts/collect-senate-2024.mjs

      - name: Python-track snapshot (independent capture; 2,000 highest-volume markets, no raw dump)
        continue-on-error: true
        run: python scripts/fetch_kalshi.py --out-dir data/kalshi --no-raw --compact --compact-max 2000 --series-file data/kalshi/universe/series.json

      - name: Cross-check the two collectors (Node events feed vs Python markets feed)
        continue-on-error: true
        run: node scripts/crosscheck-collectors.mjs

      # Runtime budget (irregularity #81): the script's own --budget-minutes must stay
      # STRICTLY BELOW this step timeout, or the runner kills it mid-phase and the
      # settled-2026 seed never reaches its writeFileSync — which is exactly what
      # silently froze the seed at its 2026-09-19 content on 2026-09-21 and 2026-09-22
      # (both steps ran 25.2 min against a 25 min limit and were reported "success"
      # by continue-on-error). 30 min timeout / 24 min budget leaves a 6 min margin for
      # the final writes, and --concurrency 6 keeps the open-universe phase at roughly
      # a fifth of Kalshi's documented 20 req/s Basic read ceiling.
      - name: FULL open-market universe snapshot (forward loop -> data/kalshi/forward/)
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/collect-universe.mjs --concurrency 6 --budget-minutes 24 || echo "::warning::forward universe capture failed - previous snapshot stays in place"

      # A truncated capture is legitimate (the budget is a safety valve), but it must be
      # VISIBLE. This surfaces it as a workflow warning instead of leaving it only in meta.
      - name: Report universe capture completeness
        continue-on-error: true
        run: |
          META="data/kalshi/forward/meta-$(date -u +%F).json"
          if [ ! -f "$META" ]; then
            echo "::warning::no universe meta for today ($META) - the capture step wrote nothing"
            exit 0
          fi
          node -e '
            const m = require("./" + process.argv[1]);
            const r = m.runtime || {};
            console.log(`universe capture: ${m.openMarkets} open markets, ${m.settled2026Markets} settled-2026 (${m.settled2026WithBars} with bars), ${r.elapsedMinutes} min at concurrency ${r.concurrency}`);
            for (const p of r.phasesTruncated || []) console.log(`::warning::universe capture truncated - ${p}`);
            if (r.complete === false) console.log("::warning::universe capture INCOMPLETE - the next run resumes where this one stopped");
          ' "$META"

      - name: 2024 per-state Senate races capture (forward loop -> data/kalshi/historical-2024/)
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/collect-senate-2024-races.mjs || echo "::warning::senate-races capture failed - previous capture stays in place"

      - name: Third-layer collectors — Metaculus hub + question pages, State Navigate free pages (rendered), R13 rendering cross-check (R14/R13)
        continue-on-error: true
        timeout-minutes: 30
        env:
          METACULUS_API_TOKEN: ${{ secrets.METACULUS_API_TOKEN }}
        run: |
          node scripts/collect-metaculus.mjs || echo "::warning::metaculus capture failed (parse or fetch) - row recorded as failed, nothing estimated"
          node scripts/collect-statenavigate.mjs || echo "::warning::state navigate capture failed - previous rows stay in place"
          node scripts/crosscheck-renderings.mjs || echo "::warning::rendering cross-check failed - previous rows stay in place"

      - name: Host re-test monitor (R15) — previously unreachable URLs, re-tested from this runner
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/probe-hosts.mjs || echo "::warning::host probe failed - previous rows stay in place"

      - name: Certified-canvass ingestion (P0, post-Nov 3) — stages certified outcomes; before election night this records no-url-yet rows
        continue-on-error: true
        timeout-minutes: 20
        run: |
          node scripts/gen-canvass-config.mjs
          node scripts/ingest-canvass.mjs || echo "::warning::canvass ingestion failed - staging stays at the previous run"

      - name: Forward-loop analytics (senate backtest + live 2026 calibration tracker)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node scripts/run-senate-backtest.mjs || echo "::warning::senate backtest rerun failed"
          node scripts/run-calibration.mjs || echo "::warning::calibration tracker rerun failed"

      - name: Refresh poll-layer provenance (universe capturedAt anchor)
        # Re-anchors data/polls/poll-layer-2026.json::candidateMismatchProvenance.universeCapturedAt
        # to the universe capture just written by collect-kalshi.mjs. The field is the
        # audit header that says "every stateRaces[].candidateMismatch was computed against
        # THIS universe snapshot" — when the universe is re-captured and the header is left
        # stale, the verification gate (test/verification-gates.test.mjs "wrong nominees") fails.
        # Idempotent; depends on the universe step succeeding (which is the collect step itself).
        continue-on-error: true
        run: node scripts/refresh-poll-layer-provenance.mjs || echo "::warning::poll-layer provenance refresh failed - header stays at its previous value"

      - name: Snapshot this run's kalshi capture (integrity anchor for the commit step)
        id: kanchor
        run: |
          # Hash exactly the files collect-kalshi.mjs writes (taken AFTER the cross-check merge of
          # tracker/history.json, since that rewrite is expected within this run). The commit step
          # re-hashes them after any rebase and re-captures if a push race mixed another run's rows
          # into them: a 3-way merge of the ~4MB universe JSON can splice two captures' blocks
          # together (irregularity #65, 2026-09-20: bySeries from one fetch state, events from
          # another). The commit must stay a single-run snapshot.
          sha256sum \
            data/kalshi/universe/latest.json \
            data/kalshi/universe/series.json \
            data/kalshi/tracker/index.json \
            data/kalshi/tracker/settlements.json \
            data/kalshi/tracker/calibration.json \
            data/kalshi/tracker/discrepancy-watch.json \
            data/kalshi/tracker/history.json \
            "data/kalshi/tracker/daily/$(date -u +%F).csv" \
            "data/kalshi/tracker/daily/$(date -u +%F).meta.json" \
            | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/kalshi-capture.sha256"
          echo "kalshi-capture-hash=$(cat "$RUNNER_TEMP/kalshi-capture.sha256")" >> "$GITHUB_OUTPUT"

      - name: Regenerate backtests, contest, site bundle
        id: pipeline
        run: npm run pipeline

      - name: Sync Python-track site data
        id: sync
        run: python scripts/sync_site_data.py

      - name: Provenance lint + tests
        id: verify
        run: |
          npm run lint
          npm test

      - name: Upload run artifacts (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-collection-${{ github.run_id }}
          path: |
            data/kalshi/universe
            data/kalshi/tracker
            data/kalshi/historical
            data/kalshi/LATEST.json
            data/kalshi/forward
            data/kalshi/historical-2024
            data/calibration-2026.json
            data/senate-2024-backtest.json
            data/polls/polls-2026-series.json
            data/crosslayer
            data/statenavigate
            data/probes
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "elections-collector[bot]"
          git config user.email "elections-collector[bot]@users.noreply.github.com"
          if [ "${{ steps.pipeline.outcome }}" != "success" ] || [ "${{ steps.sync.outcome }}" != "success" ] || [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "pipeline/sync/verify did not all succeed (${{ steps.pipeline.outcome }}/${{ steps.sync.outcome }}/${{ steps.verify.outcome }}): keeping raw data, restoring generated site bundles"
            git checkout -- src/data/ docs/data/ || true
          fi
          git add -A data/ src/data/ docs/data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "collect: kalshi $(date -u +%F) (run ${{ github.run_id }})"
          # Push race: a human commit may land while this job runs. Rebase onto it; if a generated file
          # conflicts (site bundle, tracker files) keep THIS run's version (-X theirs during a rebase means
          # the commit being replayed, i.e. the bot commit) — those files are regenerated every run anyway.
          #
          # Single-run-snapshot guard (irregularity #65, 2026-09-20): -X theirs resolves whole conflicts in
          # the bot's favour, but a 3-way merge of the ~4MB universe JSON can still splice clean hunks from
          # the other side into it (bySeries/topMarkets from one capture next to events from another — the
          # committed file then fails the offline replay test). After every rebase, re-hash the files this
          # run wrote and, if they changed, recapture so the pushed commit is again one consistent run.
          recapture_if_mixed() {
            local now
            now=$(sha256sum \
                data/kalshi/universe/latest.json \
                data/kalshi/universe/series.json \
                data/kalshi/tracker/index.json \
                data/kalshi/tracker/settlements.json \
                data/kalshi/tracker/calibration.json \
                data/kalshi/tracker/discrepancy-watch.json \
                data/kalshi/tracker/history.json \
                "data/kalshi/tracker/daily/$(date -u +%F).csv" \
                "data/kalshi/tracker/daily/$(date -u +%F).meta.json" \
                2>/dev/null | sha256sum | awk '{print $1}')
            if [ "$now" = "${{ steps.kanchor.outputs.kalshi-capture-hash }}" ]; then return 0; fi
            echo "::warning::rebase changed this run's kalshi files — recapturing so the commit stays a single-run snapshot (#65)"
            node scripts/collect-kalshi.mjs
            npm run pipeline
            npm run lint
            npm test
            git add -A data/ src/data/ docs/data/
            git commit --amend --no-edit
          }
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}"; then
              if recapture_if_mixed && git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "push failed after retries" && exit 1

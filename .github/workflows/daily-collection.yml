# Daily Kalshi collection (forward data loop — ROADMAP R1/R3).
# Runs the collector where general internet is available, then rebuilds
# the site bundle and commits the diff. Disabled by default: enable by
# setting the `enabled` input to true once the collector has been proven
# against the live API (the 2026-09-18 session captured data via a
# proxied fetch tool; this workflow is the standing loop).
name: daily-collection
on:
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Run the collector (default false)'
        required: false
        default: 'false'
  schedule:
    - cron: '30 12 * * *' # 12:30 UTC daily (US markets mid-session)

jobs:
  collect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enabled == 'true' || (github.event_name == 'schedule' && vars.COLLECT_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect + rebuild
        run: node scripts/collect-kalshi.mjs
      - name: Lint provenance
        run: node scripts/lint-verified.mjs
      - name: Tests
        run: node --test
      - name: Commit changes
        run: |
          git config user.name "elections-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/ src/data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "collect: kalshi $(date -u +%F)"
            git push
          fi
